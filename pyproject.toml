[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book2md"
version = "0.2.0"
description = "Turn a folder of photographed book pages into clean Markdown and DOCX: OCR -> LLM repair -> LLM formatting -> export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "book2md contributors" }]
keywords = ["ocr", "llm", "markdown", "docx", "books", "photos"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Core dependencies. Everything is free/open: no local models, no paid APIs required.
dependencies = [
    "typer>=0.12",            # CLI framework (Phase 1 interface)
    "rich>=13",               # progress bars + summaries in the CLI
    "httpx>=0.27",            # async HTTP for OCR and LLM providers
    "pydantic>=2.7",          # settings validation
    "pydantic-settings>=2.3", # .env-based configuration
    "pillow>=10.4",           # EXIF ordering + image preparation
    "pypandoc>=1.13",         # Markdown -> DOCX via pandoc
    "python-docx>=1.1",       # verify the exported DOCX opens
]

[project.optional-dependencies]
# HEIC support is optional because it needs a system-level libheif.
heic = ["pillow-heif>=0.16"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
book2md = "book2md.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
